<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Data Studio reference architecture</title>
  <desc id="description">Hugging Face repositories enter an ingestion and parsing pipeline which publishes metadata, immutable revisions, object storage, indexes, and a Dataset Viewer.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1120" y2="635" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748B"/>
    </marker>
    <style>
      .eyebrow { font: 700 16px Arial, sans-serif; letter-spacing: 3px; fill: #2563EB; }
      .heading { font: 700 42px Arial, sans-serif; fill: #0F172A; }
      .subheading { font: 400 18px Arial, sans-serif; fill: #64748B; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #0F172A; }
      .node-copy { font: 400 13px Arial, sans-serif; fill: #64748B; }
      .node-title-light { font: 700 18px Arial, sans-serif; fill: #FFFFFF; }
      .node-copy-light { font: 400 13px Arial, sans-serif; fill: #DBEAFE; }
      .flow { fill: none; stroke: #64748B; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <circle cx="1090" cy="75" r="155" fill="#DBEAFE" opacity="0.6"/>
  <circle cx="110" cy="640" r="190" fill="#EDE9FE" opacity="0.55"/>

  <text class="eyebrow" x="76" y="72">TONAI DATA STUDIO</text>
  <text class="heading" x="76" y="122">Immutable dataset publication</text>
  <text class="subheading" x="76" y="156">From repository ingestion to revision-scoped serving</text>

  <path class="flow" d="M267 275H340"/>
  <path class="flow" d="M267 392H310Q340 392 340 362V341"/>
  <path class="flow" d="M545 305H620"/>
  <path class="flow" d="M806 275H860"/>
  <path class="flow" d="M806 335H832Q846 335 846 349V389H860"/>
  <path class="flow" d="M806 410H827Q842 410 842 425V463Q842 478 857 478H1087Q1102 478 1102 493"/>
  <path class="flow" d="M966 434V493"/>
  <path class="flow" d="M1125 493V434"/>

  <g filter="url(#shadow)">
    <rect x="76" y="227" width="191" height="96" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="108" cy="259" r="14" fill="#EFF6FF"/>
    <path d="M100 259H116M108 251V267" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <text class="node-title" x="132" y="265">HF-compatible repo</text>
    <text class="node-copy" x="100" y="293">Upload source adapter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="76" y="344" width="191" height="96" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="108" cy="376" r="14" fill="#FEF3C7"/>
    <path d="M99 379C103 366 113 366 117 379" fill="none" stroke="#D97706" stroke-width="2"/>
    <text class="node-title" x="132" y="382">Hugging Face Hub</text>
    <text class="node-copy" x="100" y="410">Pinned upstream commit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="243" width="205" height="124" rx="20" fill="url(#primary)"/>
    <text class="node-title-light" x="366" y="286">Repository ingestion</text>
    <text class="node-copy-light" x="366" y="315">Validate · checksum · stage</text>
    <text class="node-copy-light" x="366" y="339">Idempotent publication flow</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="243" width="186" height="184" rx="20" fill="#0F172A"/>
    <text class="node-title-light" x="646" y="286">HF format parser</text>
    <text class="node-copy-light" x="646" y="317">Dataset Card</text>
    <text class="node-copy-light" x="646" y="342">Configs and splits</text>
    <text class="node-copy-light" x="646" y="367">Canonical manifest</text>
    <text class="node-copy-light" x="646" y="392">Safe, deterministic parsing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="227" width="181" height="96" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text class="node-title" x="885" y="265">PostgreSQL</text>
    <text class="node-copy" x="885" y="293">Metadata catalog</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="344" width="181" height="90" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text class="node-title" x="885" y="379">Git + DVC</text>
    <text class="node-copy" x="885" y="406">Immutable revision</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="493" width="150" height="90" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text class="node-title" x="885" y="528">RustFS</text>
    <text class="node-copy" x="885" y="552">Content-addressed</text>
    <text class="node-copy" x="885" y="570">objects</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1022" y="493" width="130" height="90" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text class="node-title" x="1045" y="528">Indexes</text>
    <text class="node-copy" x="1045" y="552">Arrow /</text>
    <text class="node-copy" x="1045" y="570">Parquet</text>
  </g>

  <rect x="76" y="532" width="696" height="78" rx="18" fill="#FFFFFF" fill-opacity="0.72" stroke="#E2E8F0"/>
  <text class="node-title" x="103" y="564">Publication barrier</text>
  <text class="node-copy" x="103" y="589">Readers see the previous ready revision or the complete new revision — never partial state.</text>

  <rect x="1053" y="227" width="99" height="207" rx="20" fill="#EFF6FF" stroke="#93C5FD"/>
  <text class="node-title" x="1073" y="268">Dataset</text>
  <text class="node-title" x="1073" y="291">Viewer</text>
  <text class="node-copy" x="1073" y="326">Query</text>
  <text class="node-copy" x="1073" y="348">Preview</text>
  <text class="node-copy" x="1073" y="370">Download</text>
  <text class="node-copy" x="1073" y="392">Export</text>
</svg>
